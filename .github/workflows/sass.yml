name: Sass

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: sass-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  sass:
    name: Dart Sass ${{ matrix.package.version }}
    runs-on: ubuntu-latest

    env:
      PUPPETEER_SKIP_DOWNLOAD: true

      RULE_1: '@import "nhsuk";'
      RULE_2: '@use "nhsuk" as *;'
      RULE_3: '@forward "nhsuk";'
      RULE_4: '@forward "nhsuk-frontend/dist/nhsuk";'
      RULE_5: '@forward "nhsuk-frontend/dist/nhsuk/core";'
      RULE_6: '@forward "nhsuk-frontend/dist/nhsuk/core/all";'
      RULE_7: '@forward "node_modules/nhsuk-frontend/dist/nhsuk";'
      RULE_8: '@forward "node_modules/nhsuk-frontend/dist/nhsuk/core";'
      RULE_9: '@forward "node_modules/nhsuk-frontend/dist/nhsuk/core/all";'
      RULE_10: '@forward "pkg:nhsuk-frontend";'
      RULE_11: '@forward "pkg:nhsuk-frontend/dist/nhsuk";'
      RULE_12: '@forward "pkg:nhsuk-frontend/dist/nhsuk/core";'
      RULE_13: '@forward "pkg:nhsuk-frontend/dist/nhsuk/core/all";'
      RULE_14: '@forward "pkg:nhsuk-frontend/components/code";'
      RULE_15: '@forward "pkg:nhsuk-frontend/lib/highlighter/styles";'
      RULE_16: '@use "nhsuk-frontend/dist/nhsuk/core/settings/colours-applied" as *;'

    strategy:
      fail-fast: false

      matrix:
        package:
          # Release without major deprecations
          - version: 1.77.6

          # Release with `mixed-decls` deprecated
          - version: 1.77.7

          # Release with `color-functions` deprecated
          - version: 1.79.0

          # Release with `import` deprecated
          - version: 1.80.0

          # Release with `misplaced-rest` deprecated
          - version: 1.91.0

          # Release with `with-private` deprecated
          - version: 1.92.0

          # Release with `if-function` deprecated
          - version: 1.95.0

          # Release with `function-name` deprecated
          - version: 1.98.0

          # Release with `adjacent-compounds` deprecated
          - version: 1.100.0

          # Dart Sass latest major version
          - tag: latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install and build
        uses: ./.github/workflows/actions/build

      - name: Install package
        run: |
          npm install -g sass@${{ matrix.package.version || matrix.package.tag }}
          sass --version

      - name: Create test files
        run: |
          mkdir -p .tmp
          echo '${{ env.RULE_1 }}' > .tmp/input1.scss
          echo '${{ env.RULE_2 }}' > .tmp/input2.scss
          echo '${{ env.RULE_3 }}' > .tmp/input3.scss
          echo '${{ env.RULE_4 }}' > .tmp/input4.scss
          echo '${{ env.RULE_5 }}' > .tmp/input5.scss
          echo '${{ env.RULE_6 }}' > .tmp/input6.scss
          echo '${{ env.RULE_7 }}' > .tmp/input7.scss
          echo '${{ env.RULE_8 }}' > .tmp/input8.scss
          echo '${{ env.RULE_9 }}' > .tmp/input9.scss
          echo '${{ env.RULE_10 }}' > .tmp/input10.scss
          echo '${{ env.RULE_11 }}' > .tmp/input11.scss
          echo '${{ env.RULE_12 }}' > .tmp/input12.scss
          echo '${{ env.RULE_13 }}' > .tmp/input13.scss
          echo '${{ env.RULE_14 }}' > .tmp/input14.scss
          echo '${{ env.RULE_15 }}' > .tmp/input15.scss
          echo '${{ env.RULE_16 }}' > .tmp/input16.scss

      - name: Check compilation
        run: |
          time sass packages/nhsuk-frontend/dist/nhsuk/nhsuk.scss ${{ format(matrix.package.version && '--fatal-deprecation {0}' || '', matrix.package.version) }} --load-path . .tmp/check.css

      - name: Check load paths
        run: |
          time sass .tmp/input1.scss --load-path packages/nhsuk-frontend/dist .tmp/check1.css
          time sass .tmp/input2.scss --load-path packages/nhsuk-frontend/dist .tmp/check2.css
          time sass .tmp/input3.scss --load-path packages/nhsuk-frontend/dist .tmp/check3.css
          time sass .tmp/input4.scss --load-path node_modules .tmp/check4.css
          time sass .tmp/input5.scss --load-path node_modules .tmp/check5.css
          time sass .tmp/input6.scss --load-path node_modules .tmp/check6.css
          time sass .tmp/input7.scss --load-path . .tmp/check7.css
          time sass .tmp/input8.scss --load-path . .tmp/check8.css
          time sass .tmp/input9.scss --load-path . .tmp/check9.css

      - name: Check package importer
        run: |
          time sass .tmp/input10.scss --pkg-importer node .tmp/check10.css
          time sass .tmp/input11.scss --pkg-importer node .tmp/check11.css
          time sass .tmp/input12.scss --pkg-importer node .tmp/check12.css
          time sass .tmp/input13.scss --pkg-importer node .tmp/check13.css
          time sass .tmp/input14.scss --pkg-importer node .tmp/check14.css
          time sass .tmp/input15.scss --pkg-importer node .tmp/check15.css
          time sass .tmp/input16.scss --pkg-importer node --load-path node_modules .tmp/check16.css

      # Check output for uncompiled Sass
      - name: Check output
        run: |
          ! grep "\$nhsuk-" .tmp/check.css
          ! grep ": nhsuk-" .tmp/check.css

          ! grep "\$nhsuk-" .tmp/check1.css
          ! grep ": nhsuk-" .tmp/check1.css

          ! grep "\$nhsuk-" .tmp/check2.css
          ! grep ": nhsuk-" .tmp/check2.css

          ! grep "\$nhsuk-" .tmp/check3.css
          ! grep ": nhsuk-" .tmp/check3.css

          ! grep "\$nhsuk-" .tmp/check4.css
          ! grep ": nhsuk-" .tmp/check4.css

          ! grep "\$nhsuk-" .tmp/check5.css
          ! grep ": nhsuk-" .tmp/check5.css

          ! grep "\$nhsuk-" .tmp/check6.css
          ! grep ": nhsuk-" .tmp/check6.css

          ! grep "\$nhsuk-" .tmp/check7.css
          ! grep ": nhsuk-" .tmp/check7.css

          ! grep "\$nhsuk-" .tmp/check8.css
          ! grep ": nhsuk-" .tmp/check8.css

          ! grep "\$nhsuk-" .tmp/check9.css
          ! grep ": nhsuk-" .tmp/check9.css

          ! grep "\$nhsuk-" .tmp/check10.css
          ! grep ": nhsuk-" .tmp/check10.css

          ! grep "\$nhsuk-" .tmp/check11.css
          ! grep ": nhsuk-" .tmp/check11.css

          ! grep "\$nhsuk-" .tmp/check12.css
          ! grep ": nhsuk-" .tmp/check12.css

          ! grep "\$nhsuk-" .tmp/check13.css
          ! grep ": nhsuk-" .tmp/check13.css

          ! grep "\$nhsuk-" .tmp/check14.css
          ! grep ": nhsuk-" .tmp/check14.css

          ! grep "\$nhsuk-" .tmp/check15.css
          ! grep ": nhsuk-" .tmp/check15.css

          ! grep "\$nhsuk-" .tmp/check16.css
          ! grep ": nhsuk-" .tmp/check16.css
