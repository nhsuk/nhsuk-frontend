# Create the release on GitHub first (tick "Set as a pre-release" for versions like v1.0.0-beta.1)
name: Publish release

on:
  release:
    types: [published]

concurrency:
  group: release

jobs:
  build:
    name: Publish release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org/

      - name: Get package version
        id: get_version
        run: |
          VERSION=$(node -p "require('./packages/nhsuk-frontend/package.json').version")
          if [ "$TAG_NAME" != "v$VERSION" ]; then
            echo "::error::Release tag ($TAG_NAME) does not match package.json version (v$VERSION)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test --ignore-scripts

      - name: Create release artifact
        run: npm run release --workspace nhsuk-frontend
        env:
          NPM_PACKAGE_VERSION: ${{ steps.get_version.outputs.VERSION }}

      - name: Upload release asset
        run: gh release upload "v${VERSION}" "./dist/nhsuk-frontend-${VERSION}.zip"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}

      - name: Publish npm package
        if: ${{ !github.event.release.prerelease }}
        run: npm publish --workspace nhsuk-frontend --tag latest

      - name: Publish npm package (pre-release)
        if: ${{ github.event.release.prerelease }}
        run: npm publish --workspace nhsuk-frontend --tag next
